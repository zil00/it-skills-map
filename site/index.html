<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="What Canadian IT job postings actually ask for: skills, certs, years and salary by role." />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply a saved theme choice before the first paint, so the page doesn't flash the wrong theme.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <title>IT Skills Map: what Canadian IT jobs ask for</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
